# /etc/apache2/sites-available/nyangs-kitchen.conf
# 도메인을 정하면 ServerName 을 바꾸고:  sudo a2ensite nyangs-kitchen && sudo systemctl reload apache2
# 그 다음 HTTPS 인증서:                  sudo certbot --apache -d 도메인
<VirtualHost *:80>
    ServerName 도메인
    DocumentRoot /var/www/nyangs-kitchen/server/public

    <Directory /var/www/nyangs-kitchen/server/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # 웹에는 public 폴더만 열려요. lib, config.php 는 그 바깥이라 주소로 열 수 없어요.

    # 로그인 토큰 헤더를 PHP로 전달
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog ${APACHE_LOG_DIR}/nyangs-kitchen-error.log
    CustomLog ${APACHE_LOG_DIR}/nyangs-kitchen-access.log combined
</VirtualHost>
