<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냥's 키친 급식소 초대</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="냥's 키친 급식소 초대">
<meta property="og:description" content="이웃이 길고양이 급식소를 함께 돌보자고 초대했어요.">
<meta name="theme-color" content="#8E7CF6">
<link rel="icon" href="icon-192.png">
<style>
  @font-face{font-family:'SUIT Variable';font-weight:100 900;font-display:swap;src:url('fonts/SUIT-Variable.woff2') format('woff2-variations'),url('fonts/SUIT-Variable.woff2') format('woff2')}
  :root{--deep:#4B3FB8;--cream:#FFFFFF;--gold:#FFE3A8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(165deg,#8E7CF6 0%,#B79BFF 48%,#FFC2AC 100%);color:#fff;font:16px/1.65 'SUIT Variable','Noto Sans KR',system-ui,sans-serif;display:grid;place-items:center;padding:28px 16px}
  main{width:100%;max-width:420px;text-align:center}
  img.cat{width:130px;height:130px;filter:drop-shadow(0 14px 22px rgba(60,40,140,.35))}
  h1{font:800 30px/1.25 'SUIT Variable','Noto Sans KR',sans-serif;letter-spacing:-.6px;margin:8px 0 6px;text-shadow:0 2px 16px rgba(80,50,170,.3)}
  p{margin:0 0 18px;opacity:.9}
  .code{font:800 44px/1 'SUIT Variable',monospace;letter-spacing:8px;color:#7B6CF0;background:#fff;border-radius:24px;box-shadow:0 18px 40px -20px rgba(60,40,140,.6);padding:18px 8px;margin:6px 0 10px}
  .btn{display:block;width:100%;padding:16px;border-radius:18px;transition:transform .45s cubic-bezier(.34,1.56,.64,1);font-weight:700;font-size:17px;text-decoration:none;margin-top:12px;border:0;cursor:pointer;font-family:inherit}
  .primary{background:#fff;color:#7B6CF0;box-shadow:0 14px 30px -14px rgba(60,40,140,.6)}
  .btn:active{transform:scale(.96)}
  .ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(255,255,255,.6)}
  ol{text-align:left;margin:22px 0 0;padding:16px 16px 16px 34px;background:rgba(255,255,255,.18);border-radius:20px;font-size:14.5px}
  li{margin:4px 0}
  small{display:block;margin-top:22px;opacity:.6}
  a.plain{color:var(--cream)}
</style>
</head>
<body>
<main>
  <img class="cat" src="icon-cat.png" alt="">
  <h1>급식소에 초대받았어요</h1>
  <p>이웃이 길고양이 급식소를 함께 돌보자고 초대했어요.</p>
  <div class="code" id="code">······</div>
  <a class="btn primary" id="open" href="#">냥's 키친 앱에서 열기</a>
  <button class="btn ghost" id="copy" type="button">코드 복사</button>
  <ol>
    <li>냥's 키친 앱을 설치하고 로그인해요.</li>
    <li>아래 <b>함께</b> 탭에서 <b>+ 초대 코드 입력</b>을 눌러요.</li>
    <li>위 코드 6자리를 넣으면 끝! 코드는 7일 동안 쓸 수 있어요.</li>
  </ol>
  <small><a class="plain" href="/">냥's 키친 소개</a> · <a class="plain" href="privacy.html">개인정보처리방침</a></small>
</main>
<script>
  (function () {
    var c = (new URLSearchParams(location.search).get('c') || '').replace(/[^0-9a-z]/gi, '').toUpperCase().slice(0, 6);
    var codeEl = document.getElementById('code'), open = document.getElementById('open'), copy = document.getElementById('copy');
    if (!c) { codeEl.textContent = '코드 없음'; open.style.display = 'none'; copy.style.display = 'none'; return; }
    codeEl.textContent = c;
    var app = 'com.nyangskitchen.app://join?c=' + c;
    var android = /android/i.test(navigator.userAgent);
    open.href = android
      ? 'intent://join?c=' + c + '#Intent;scheme=com.nyangskitchen.app;package=com.nyangskitchen.app;end'
      : app;
    copy.addEventListener('click', function () {
      var done = function () { copy.textContent = '복사했어요'; setTimeout(function () { copy.textContent = '코드 복사'; }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(c).then(done, function () { prompt('초대 코드', c); });
      else prompt('초대 코드', c);
    });
  })();
</script>
</body>
</html>
