<!doctype html>
<html lang="ko" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#8E7CF6">
<title>냥's 키친</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
<style>html.booting,html.booting body{background:#8E7CF6}</style>
</head>
<body>
<div id="intro" class="intro" role="img" aria-label="냥's 키친">
  <div class="intro-veil"></div>
  <div class="intro-art nk-art" role="img" aria-label="밥그릇 앞에 앉은 하얀 아기 고양이">
    <span class="nk-shadow"></span>
    <img class="nk-cat" src="img/nk-cat.webp" alt="" width="855" height="932" decoding="sync" fetchpriority="high">
    <img class="nk-bowl" src="img/nk-bowl.webp" alt="" width="363" height="202" decoding="sync" fetchpriority="high">
    <svg class="nk-heart h1" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C5 15.5 1 12 1 7a5.5 5.5 0 0 1 11-1 5.5 5.5 0 0 1 11 1c0 5-4 8.5-11 14z"/></svg>
    <svg class="nk-heart h2" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C5 15.5 1 12 1 7a5.5 5.5 0 0 1 11-1 5.5 5.5 0 0 1 11 1c0 5-4 8.5-11 14z"/></svg>
  </div>
  <h1 class="intro-title">냥's 키친</h1>
  <p class="intro-sub">길고양이 밥 주는 사람들의 작은 부엌</p>
</div>
<div id="auth" class="auth" hidden aria-label="로그인"></div>
<div class="app" id="app">
  <section id="mapScreen" class="screen">
    <header class="topbar">
      <div><div class="brand">냥's 키친</div><div class="where" id="whereLine">내 주변 급식 지도</div></div>
      <div class="row">
        <button class="iconbtn" data-act="tab" data-v="schedule" aria-label="급식 일정" id="bellBtn"></button>
        <button class="iconbtn" data-act="settings" aria-label="설정" id="setBtn"></button>
      </div>
    </header>
    <div class="map" id="mapBox">
      <div id="kmap"></div>
      <div id="mapUi"></div>
    </div>
  </section>
  <main id="view" class="screen" hidden></main>
  <nav class="tabs" id="tabs" aria-label="주요 메뉴"></nav>
  <aside class="ad" id="adSlot" aria-label="광고 영역">
    <div class="slot"><span class="tag">AD</span><div><b>Google 테스트 광고</b><span>배너 광고가 표시되는 자리예요</span></div></div>
  </aside>
  <div id="layer"></div>
</div>
<div id="safeProbe" aria-hidden="true"></div>
<div id="safeProbeTop" aria-hidden="true"></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<script src="vendor/leaflet.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
