<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#8E7CF6">
<title>냥's 키친</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="intro" class="intro" role="img" aria-label="냥's 키친">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 0 184 148" class="intro-art" role="img" aria-label="밥그릇 앞에서 꼬리를 흔드는 고양이">
    <defs>
      <linearGradient id="nkBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F1EAFF"/><stop offset="1" stop-color="#FFD6C6"/></linearGradient>
      <radialGradient id="nkGloss" cx="35%" cy="25%" r="40%"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <linearGradient id="nkTail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-60"><stop offset="0" stop-color="#EDE4FF"/><stop offset="1" stop-color="#FFE2D6"/></linearGradient>
      <linearGradient id="nkBowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB49E"/><stop offset="1" stop-color="#FF8F7A"/></linearGradient>
      <linearGradient id="nkRim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE3D8"/><stop offset="1" stop-color="#FFD0C0"/></linearGradient>
      <filter id="nkShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#4B3BB8" flood-opacity=".3"/></filter>
    </defs>
    <g class="cat" filter="url(#nkShadow)">
      <!-- 둥글고 복실복실한 꼬리: 몸 뒤에서 좌우로 살랑살랑 -->
      <g transform="translate(60 98)"><g fill="url(#nkTail)">
        <animateTransform attributeName="transform" type="scale" values="1 1;-1 1;1 1" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="1.6s" repeatCount="indefinite"/>
        <circle cx="0.0" cy="0.0" r="9.0"/><circle cx="2.0" cy="-5.4" r="10.3"/><circle cx="6.1" cy="-10.6" r="11.3"/><circle cx="11.7" cy="-15.7" r="12.2"/><circle cx="18.5" cy="-20.5" r="13.0"/><circle cx="26.4" cy="-25.2" r="13.8"/><circle cx="35.3" cy="-29.6" r="14.6"/><circle cx="45.2" cy="-33.9" r="15.3"/><circle cx="56.0" cy="-38.0" r="16.0"/><circle cx="62" cy="-45" r="7.5"/><circle cx="66" cy="-37" r="7"/><circle cx="55" cy="-48" r="7"/><circle cx="62" cy="-30" r="6.5"/>
      </g></g>
      <g class="body">
        <path d="M60 22 C78 22 84 34 92 30 C100 26 104 40 100 52 C110 64 108 96 88 104 C76 109 44 109 32 104 C12 96 10 64 20 52 C16 40 20 26 28 30 C36 34 42 22 60 22Z" fill="url(#nkBody)"/>
        <path d="M60 22 C78 22 84 34 92 30 C100 26 104 40 100 52 C110 64 108 96 88 104 C76 109 44 109 32 104 C12 96 10 64 20 52 C16 40 20 26 28 30 C36 34 42 22 60 22Z" fill="url(#nkGloss)"/>
        <circle cx="46" cy="66" r="4.2" fill="#3B3360"/><circle cx="74" cy="66" r="4.2" fill="#3B3360"/>
        <circle cx="47.3" cy="64.6" r="1.3" fill="#fff"/><circle cx="75.3" cy="64.6" r="1.3" fill="#fff"/>
        <path d="M56 74 q4 4 8 0" stroke="#3B3360" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <ellipse cx="36" cy="76" rx="8" ry="5" fill="#FF9F8A" opacity=".45"/><ellipse cx="84" cy="76" rx="8" ry="5" fill="#FF9F8A" opacity=".45"/>
      </g>
    </g>
    <g class="bowl" filter="url(#nkShadow)" transform="translate(0 84)">
      <path d="M8 22 H112 C110 44 92 56 60 56 C28 56 10 44 8 22Z" fill="url(#nkBowl)"/>
      <ellipse cx="60" cy="22" rx="52" ry="10" fill="url(#nkRim)"/>
      <ellipse cx="60" cy="21" rx="42" ry="6.5" fill="#E9B98F"/>
      <circle cx="44" cy="18" r="4.5" fill="#D99A68"/><circle cx="54" cy="16" r="4.5" fill="#E8AE79"/><circle cx="64" cy="17" r="4.5" fill="#D99A68"/><circle cx="74" cy="18" r="4.5" fill="#E8AE79"/><circle cx="59" cy="20" r="4" fill="#F0C08E"/><circle cx="49" cy="21" r="3.6" fill="#F0C08E"/><circle cx="69" cy="21" r="3.6" fill="#D99A68"/>
      <path d="M30 38 q30 10 60 0" stroke="#fff" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g fill="#fff" fill-opacity=".8"><ellipse cx="60" cy="45" rx="4" ry="3.3"/><circle cx="54.5" cy="40" r="1.7"/><circle cx="58.3" cy="38.2" r="1.7"/><circle cx="61.7" cy="38.2" r="1.7"/><circle cx="65.5" cy="40" r="1.7"/></g>
    </g>
  </svg>
  <h1 class="intro-title">냥's 키친</h1>
  <p class="intro-sub">길고양이 밥 주는 사람들의 작은 부엌</p>
</div>
<div id="auth" class="auth" hidden aria-label="로그인"></div>
<div class="app" id="app">
  <section id="mapScreen" class="screen">
    <header class="topbar">
      <div><div class="brand">냥's 키친</div><div class="where" id="whereLine">내 주변 급식 지도</div></div>
      <div class="row">
        <button class="iconbtn" data-act="tab" data-v="schedule" aria-label="급식 일정" id="bellBtn"></button>
        <button class="iconbtn" data-act="settings" aria-label="설정" id="setBtn"></button>
      </div>
    </header>
    <div class="map" id="mapBox">
      <div id="kmap"></div>
      <div id="mapUi"></div>
    </div>
  </section>
  <main id="view" class="screen" hidden></main>
  <nav class="tabs" id="tabs" aria-label="주요 메뉴"></nav>
  <aside class="ad" id="adSlot" aria-label="광고 영역">
    <div class="slot"><span class="tag">AD</span><div><b>Google 테스트 광고</b><span>배너 광고가 표시되는 자리예요</span></div></div>
  </aside>
  <div id="layer"></div>
</div>
<div id="safeProbe" aria-hidden="true"></div>
<div id="safeProbeTop" aria-hidden="true"></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<script src="vendor/leaflet.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
