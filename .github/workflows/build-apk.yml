name: APK·AAB 빌드

# main에 올릴 때마다:
#  - 테스트용 APK (고정 디버그 키 서명) → 휴대폰에 바로 설치
#  - 출시용 AAB (업로드 키 서명) → 구글 플레이 콘솔에 업로드
#    출시용 AAB는 저장소 Secret NK_RELEASE_PASSWORD 가 있을 때만 만들어진다.
#
# 선택 Secret:
#  - KAKAO_JS_KEY      : 카카오 지도 JavaScript 키 (없으면 www/config.js 값 사용)
#  - ADMOB_APP_ID      : AdMob 앱 ID (ca-app-pub-...~...). 없으면 구글 테스트 ID
#  - ADMOB_BANNER_ID   : AdMob 배너 광고 단위 ID (ca-app-pub-.../...). 없으면 테스트 배너

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NK_VERSION_CODE: ${{ github.run_number }}
      NK_RELEASE_STORE_PASSWORD: ${{ secrets.NK_RELEASE_PASSWORD }}
      NK_RELEASE_KEY_PASSWORD: ${{ secrets.NK_RELEASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 의존성 설치
        shell: bash
        run: |
          set -o pipefail
          { npm install --no-audit --no-fund && npm ls --depth=0; } 2>&1 | tee -a build.log
          mkdir -p www/vendor
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/vendor/
          cp -r node_modules/leaflet/dist/images www/vendor/images
          cp -r node_modules/@fontsource/jua www/vendor/jua
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.js

      - name: 앱 설정 넣기 (키·광고 ID·버전)
        shell: bash
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "NK_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          {
            echo "window.NK_CONFIG = window.NK_CONFIG || {};"
            echo "window.NK_CONFIG.version = '$VERSION (${NK_VERSION_CODE})';"
            if [ -n "$KAKAO_JS_KEY" ]; then echo "window.NK_CONFIG.kakaoKey = '$KAKAO_JS_KEY';"; fi
            if [ -n "$ADMOB_BANNER_ID" ]; then echo "window.NK_CONFIG.admobBannerId = '$ADMOB_BANNER_ID';"; fi
          } >> www/config.js

      - name: 업로드 키 풀기 (Secret이 있을 때만)
        shell: bash
        env:
          NK_RELEASE_PASSWORD: ${{ secrets.NK_RELEASE_PASSWORD }}
        run: |
          if [ -n "$NK_RELEASE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in resources/android/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:NK_RELEASE_PASSWORD
            {
              echo "NK_RELEASE_KEYSTORE=$RUNNER_TEMP/upload.jks"
              echo "NK_RELEASE_KEY_ALIAS=upload"
            } >> "$GITHUB_ENV"
            echo "::add-mask::$NK_RELEASE_PASSWORD"
            echo "업로드 키 준비 완료"
          else
            echo "NK_RELEASE_PASSWORD Secret이 없어 출시용 AAB는 건너뜁니다."
          fi

      - name: 안드로이드 프로젝트 만들기
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -o pipefail
          { npx cap add android && node scripts/patch-android.mjs && npx cap sync android; } 2>&1 | tee -a build.log

      - name: 테스트용 APK 빌드
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee -a ../build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../nyangs-kitchen.apk

      - name: 출시용 AAB 빌드
        if: env.NK_RELEASE_KEYSTORE != ''
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew bundleRelease --no-daemon 2>&1 | tee -a ../build.log
          cp app/build/outputs/bundle/release/app-release.aab "../nyangs-kitchen-${NK_VERSION_NAME}-${NK_VERSION_CODE}.aab"

      - name: 출시 점검 보고서
        shell: bash
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          {
            echo "== APK 기본 정보"; "$AAPT2" dump badging nyangs-kitchen.apk | grep -E "^package:|sdkVersion|targetSdkVersion|uses-permission|application-label:" || true
            echo; echo "== APK 서명"; keytool -printcert -jarfile nyangs-kitchen.apk | grep -E "Owner|SHA1|SHA256" || true
            AAB=$(ls nyangs-kitchen-*.aab 2>/dev/null || true)
            if [ -n "$AAB" ]; then echo; echo "== AAB 서명 ($AAB)"; keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA1|SHA256" || true; fi
          } > build-info.txt
          cat build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nyangs-kitchen-${{ github.run_number }}
          path: |
            nyangs-kitchen.apk
            nyangs-kitchen-*.aab

      - name: 최신 빌드 릴리스 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          FILES="nyangs-kitchen.apk build-info.txt"
          AAB=$(ls nyangs-kitchen-*.aab 2>/dev/null || true)
          [ -n "$AAB" ] && FILES="$FILES $AAB"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $FILES \
            --title "냥's 키친 ${NK_VERSION_NAME} (빌드 ${NK_VERSION_CODE})" \
            --notes "커밋 ${GITHUB_SHA::7}. nyangs-kitchen.apk = 휴대폰 설치용 테스트 앱. ${AAB:-출시용 AAB 없음 (NK_RELEASE_PASSWORD Secret 필요)} = 플레이 콘솔 업로드용."

      - name: 실패 로그를 이슈로 남기기
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          { echo "빌드 ${{ github.run_number }} 실패 로그 (마지막 부분)"; echo '```'; grep -n -i -E "error|fail|exception|what went wrong|ERESOLVE|404" build.log | tail -n 60; echo '---'; tail -n 120 build.log; echo '```'; } > issue.md
          gh issue create --title "빌드 실패 #${{ github.run_number }}" --body-file issue.md
