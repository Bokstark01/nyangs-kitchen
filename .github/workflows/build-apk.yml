name: APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 의존성 설치
        run: |
          npm install --no-audit --no-fund
          mkdir -p www/vendor
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/vendor/
          cp -r node_modules/leaflet/dist/images www/vendor/images

      - name: 카카오 키 넣기 (저장소 Secret이 있을 때만)
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
        run: |
          if [ -n "$KAKAO_JS_KEY" ]; then
            echo "window.NK_CONFIG = { kakaoKey: '$KAKAO_JS_KEY' };" > www/config.js
          fi

      - name: 안드로이드 프로젝트 만들기
        id: prep
        shell: bash
        run: |
          set -o pipefail
          { npx cap add android && node scripts/patch-android.mjs && npx cap sync android; } 2>&1 | tee -a build.log

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee -a ../build.log

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nyangs-kitchen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nyangs-kitchen-apk
          path: nyangs-kitchen.apk

      - name: 최신 APK 릴리스 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest nyangs-kitchen.apk \
            --title "냥's 키친 최신 테스트 빌드" \
            --notes "빌드 번호 ${{ github.run_number }} · 커밋 ${GITHUB_SHA::7}. 휴대폰에서 nyangs-kitchen.apk를 받아 설치하세요."

      - name: 실패 로그를 이슈로 남기기
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          { echo "빌드 ${{ github.run_number }} 실패 로그 (마지막 부분)"; echo '```'; grep -n -i -E "error|fail|exception|what went wrong" build.log | tail -n 60; echo '---'; tail -n 120 build.log; echo '```'; } > issue.md
          gh issue create --title "빌드 실패 #${{ github.run_number }}" --body-file issue.md
